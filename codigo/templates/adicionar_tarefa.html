<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/css_mobile.css">
</head>
<body>
    <section class="caixa_tarefas">
        <div class="textos_add_tarefas">
            <div class="texto">
                <h2>Adicionar tarefa</h2>
            </div>
            <a href="{{ url_for('tarefas.tarefas') }}" class="botao">Voltar</a>
        </div>
        <div class="parte_forms">
            <form action="{{url_for('tarefas.adicionar_tarefa')}}  "method="POST">
                <div class="campo">
                    <label for="tarefa">Nome da tarefa</label>
                    <input type="text" id="tarefa" name="tarefa" placeholder="digite o nome da tarefa" required>
                </div>
                <div class="campo">
                    <label for="data">Digite a data</label>
                    <input type="date" id="data" name="data" required>
                </div>
                <div class="campo_botao">
                    <button type="submit">Salvar tarefa</button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
